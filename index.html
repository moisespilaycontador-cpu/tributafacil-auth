
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TributaFacil XML - Acceso</title>
</head>
<body>
  <h1>TributaFacil XML</h1>
  <p id="mensaje">Comprobando el acceso...</p>

  <script>
    (() => {
      const EXTENSION_ID = "knegafbgeacklehkjhieejifdicepkka";
      const mensaje = document.getElementById("mensaje");
      const params = new URLSearchParams(
        window.location.hash.slice(1)
      );

      const accessToken = params.get("access_token");
      const refreshToken = params.get("refresh_token");
      const error = params.get("error_description");

      // Quitar los tokens de la barra de direcciones.
      if (accessToken || refreshToken) {
        history.replaceState(null, "", window.location.pathname);
      }

      if (error) {
        mensaje.textContent =
          "El enlace expiró o no es válido. Solicita otro correo.";
        return;
      }

      if (!accessToken || !refreshToken) {
        mensaje.textContent =
          "Abre el enlace de acceso más reciente que recibiste por correo.";
        return;
      }

      if (!chrome?.runtime?.sendMessage) {
        mensaje.textContent =
          "No se pudo contactar con la extensión. Comprueba que esté instalada y habilitada.";
        return;
      }

      chrome.runtime.sendMessage(
        EXTENSION_ID,
        {
          type: "TRIBUTAFACIL_AUTH_CALLBACK",
          access_token: accessToken,
          refresh_token: refreshToken
        },
        (response) => {
          if (chrome.runtime.lastError || !response?.ok) {
            mensaje.textContent =
              "No se pudo completar el acceso. Comprueba la configuración de la extensión e inténtalo de nuevo.";
            return;
          }

          mensaje.textContent =
            "Acceso recibido. Ya puedes volver a TributaFacil XML.";
        }
      );
    })();
  </script>
</body>
</html>
